# Site of the single sign-on demo in the image of demo-sso/Dockerfile: every
# request goes to demo-sso/public/index.php, as with the PHP built-in web
# server of bin/demo-sso, whatever the host name (idp., mail., crm. or the
# domain itself): the script tells the sites apart.

ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8000>
    DocumentRoot /app/demo-sso/public

    <Directory /app/demo-sso/public>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # At the level of the site, not of the directory: there, mod_rewrite
    # needs FollowSymLinks, which Options None turns off.
    RewriteEngine On
    RewriteRule ^ /app/demo-sso/public/index.php [END]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
