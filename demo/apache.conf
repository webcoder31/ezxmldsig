# Site of the demo in the image of demo/Dockerfile: every request goes to
# demo/public/index.php, as with the PHP built-in web server of bin/demo, so
# that the files of the interface get the same headers as the API.

ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8000>
    DocumentRoot /app/demo/public

    <Directory /app/demo/public>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # At the level of the site, not of the directory: there, mod_rewrite
    # needs FollowSymLinks, which Options None turns off.
    RewriteEngine On
    RewriteRule ^ /app/demo/public/index.php [END]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
